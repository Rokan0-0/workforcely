<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Minimalist Clean Dark Container (Optimal for favicons and app icons) -->
  <rect width="100" height="100" rx="22" fill="#0f172a" />
  
  <!-- Interlocking Modern "W" Ribbons -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Primary Left Ribbon (Navy/Royal) -->
    <path 
      d="M 23 34 C 23 46 29 70 41 70 C 49 70 54 58 58 48 C 63 36 67 34 71 34" 
      stroke="#3b82f6" 
      stroke-width="9" 
    />
    <!-- Intersecting Right Ribbon (Emerald Teal) -->
    <path 
      d="M 29 34 C 33 34 37 36 42 48 C 46 58 51 70 59 70 C 71 70 77 46 77 34" 
      stroke="#14b8a6" 
      stroke-width="9" 
    />
  </g>
</svg>
